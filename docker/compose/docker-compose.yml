services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres18:/var/lib/postgresql
    x-required-env: [POSTGRES_PASSWORD]
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
  auth:
    image: suxiaoshao/auth:latest
    container_name: auth
    restart: always
    environment:
      AUTH_PG: null
      USERNAME: null
      PASSWORD: null
      SECRET: null
      AUTH_ORIGIN: null
      AUTH_RP_ID: null
    x-required-env: [AUTH_PG, USERNAME, PASSWORD, SECRET]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/auth', '--check-ready']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
  login:
    image: suxiaoshao/login:latest
    container_name: login
    restart: always
    environment:
      AUTH_ORIGIN: null
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/login', '--check-ready']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
  bookmarks:
    image: suxiaoshao/bookmarks:latest
    container_name: bookmarks
    restart: always
    environment:
      BOOKMARKS_PG: null
      AUTH_ORIGIN: null
      CORS_ALLOWED_ORIGINS: null
    x-required-env: [BOOKMARKS_PG]
    depends_on:
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/bookmarks', '--check-ready']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
  collections:
    image: suxiaoshao/collections:latest
    container_name: collections
    restart: always
    environment:
      COLLECTIONS_PG: null
      AUTH_ORIGIN: null
      CORS_ALLOWED_ORIGINS: null
    x-required-env: [COLLECTIONS_PG]
    depends_on:
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/collections', '--check-ready']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
  web:
    image: suxiaoshao/gateway:latest
    container_name: web
    restart: always
    environment:
      GATEWAY_AUTH_HOST: null
      GATEWAY_BOOKMARKS_HOST: null
      GATEWAY_COLLECTIONS_HOST: null
      GATEWAY_MAIN_HOST: null
      GATEWAY_LOGIN_UPSTREAM: null
      GATEWAY_BOOKMARKS_UPSTREAM: null
      GATEWAY_COLLECTIONS_UPSTREAM: null
      GATEWAY_COLLECTIONS_WEB_UPSTREAM: null
      GATEWAY_MAIN_WEB_UPSTREAM: null
      GATEWAY_LISTEN_HTTP: null
      GATEWAY_LISTEN_HTTPS: null
      GATEWAY_TLS_CERT: null
      GATEWAY_TLS_KEY: null
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /private/etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      login:
        condition: service_healthy
      bookmarks:
        condition: service_healthy
      collections:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/gateway', '--check-ready']
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3
volumes:
  postgres18:
    name: postgres18-data
    external: true
    x-exclusive: true
