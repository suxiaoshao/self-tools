name: login-docker-build
on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - docker/docker-bake.hcl
      - docker/server/rust/**
      - docker/server/login.Dockerfile
      - server/packages/login/**
      - server/common/middleware/**
      - server/common/service-errors/**
      - server/common/service-health/**
      - server/common/telemetry/**
      - server/common/thrift/**
      - Cargo.lock
      - Cargo.toml
      - .cargo/**
      - .github/workflows/login.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/bake-action@v7
        env:
          TAG: ${{ github.sha }}
        with:
          source: .
          files: docker/docker-bake.hcl
          targets: login
          push: true
          set: |
            login.tags+=suxiaoshao/login:latest
