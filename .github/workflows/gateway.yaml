name: gateway-docker-build
on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - docker/docker-bake.hcl
      - docker/server/rust/**
      - server/common/service-health/**
      - docker/server/gateway.Dockerfile
      - server/packages/gateway/**
      - server/common/middleware/**
      - Cargo.lock
      - Cargo.toml
      - .cargo/**
      - .github/workflows/gateway.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/bake-action@v7
        env:
          TAG: ${{ github.sha }}
        with:
          source: .
          files: docker/docker-bake.hcl
          targets: gateway
          push: true
          set: |
            gateway.tags=suxiaoshao/gateway:latest,suxiaoshao/gateway:${{ github.sha }}
