name: ci
on:
  pull_request:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#web --command bash -e {0}
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: GraphQL generated contract
        run: pnpm graphql:check
      - name: Production build and budgets
        run: pnpm build:check
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#backend --command bash -e {0}
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: server Lint
        run: cargo clippy --all --locked
      - name: server test
        run: cargo test --all --locked
