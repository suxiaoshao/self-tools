name: ci
on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether build checks are needed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown comparisons and manual runs retain the full checks.
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|README.zh-CN.md|AGENTS.md|CLAUDE.md|docs/*.md|.agents/skills/*.md|.claude/skills) ;;
              *) exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo 'run=false' >> "$GITHUB_OUTPUT"
          echo 'Documentation-only changes: skipping build and test jobs.' >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: changes
    # If classification fails, keep running the existing checks.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#web --command bash -e {0}
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: GraphQL generated contract
        run: pnpm graphql:check
      - name: Production build and budgets
        run: pnpm build:check
  server:
    needs: changes
    # If classification fails, keep running the existing checks.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#backend --command bash -e {0}
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: server Lint
        run: cargo clippy --all --locked
      - name: server test
        run: cargo test --all --locked
