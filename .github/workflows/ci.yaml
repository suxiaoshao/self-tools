name: ci
on:
  pull_request:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Node.js, pnpm and dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: GraphQL generated contract
        run: pnpm graphql:check
      - name: Production build and budgets
        run: pnpm build:check
  server:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools
        run: sudo apt update && sudo apt install mold clang -y
      - name: server Lint
        run: cargo clippy --all
      - name: server test
        run: cargo test --all
