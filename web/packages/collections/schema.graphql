union AddMembershipResult = CollectionMembershipChanged | ValidationFailure | MissingResources | Conflict

type Collection {
	id: Int!
	name: String!
	path: String!
	parentId: Int
	description: String
	createTime: DateTime!
	updateTime: DateTime!
	ancestors: [Collection!]
}

input CollectionItemQuery {
	id: Int
	createTime: TimeRange
	updateTime: TimeRange
	pagination: Pagination!
}

type CollectionMembershipChanged {
	collectionId: Int!
	resource: ResourceRef!
	present: Boolean!
}

"""
A committed collection identifier; no fallible post-write reads.
"""
type CollectionSaved {
	collectionId: Int!
}

union CollectionWriteResult = CollectionSaved | ValidationFailure | MissingResources | Conflict

type Conflict {
	reason: ConflictReason!
	resources: [ResourceRef!]!
}

enum ConflictReason {
	COLLECTION_PATH_EXISTS
	MEMBERSHIP_EXISTS
}

scalar DateTime

union DeleteResult = ResourceDeleted | ValidationFailure

type FieldViolation {
	path: [String!]!
	code: ValidationCode!
	min: Int
	max: Int
}

type Item {
	id: Int!
	name: String!
	content: String!
	createTime: DateTime!
	updateTime: DateTime!
	collections: [Collection!]
}

union ItemAndCollection = Item | Collection

type ItemAndCollectionList {
	data: [ItemAndCollection!]!
	total: Int!
}

type ItemList {
	data: [Item!]!
	total: Int!
}

type ItemSaved {
	itemId: Int!
}

union ItemWriteResult = ItemSaved | ValidationFailure | MissingResources

type MissingResources {
	resources: [ResourceRef!]!
}

type MutationRoot {
	createCollection(name: String!, parentId: Int, description: String): CollectionWriteResult!
	updateCollection(id: Int!, name: String!, description: String): CollectionWriteResult!
	createItem(name: String!, content: String!, collectionIds: [Int!]!): ItemWriteResult!
	updateItem(id: Int!, name: String!, content: String!): ItemWriteResult!
	deleteCollection(id: Int!): DeleteResult!
	deleteItem(id: Int!): DeleteResult!
	addCollectionForItem(collectionId: Int!, itemId: Int!): AddMembershipResult!
	deleteCollectionForItem(collectionId: Int!, itemId: Int!): RemoveMembershipResult!
}

input Pagination {
	page: Int! = 1
	pageSize: Int! = 10
}

type QueryRoot {
	allCollections: [Collection!]!
	getCollection(id: Int!): Collection
	getItem(id: Int!): Item
	collectionAndItem(query: CollectionItemQuery!): ItemAndCollectionList!
	queryItems(collectionMatch: TagMatch, pagination: Pagination!): ItemList!
}

union RemoveMembershipResult = CollectionMembershipChanged | ValidationFailure

type ResourceDeleted {
	resource: ResourceRef!
}

enum ResourceKind {
	COLLECTION
	ITEM
}

type ResourceRef {
	kind: ResourceKind!
	id: Int!
}

input TagMatch {
	matchSet: [Int!]!
	fullMatch: Boolean!
}

input TimeRange {
	start: DateTime!
	end: DateTime!
}

enum ValidationCode {
	REQUIRED
	INVALID_FORMAT
	TOO_LONG
	OUT_OF_RANGE
}

type ValidationFailure {
	issues: [FieldViolation!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
