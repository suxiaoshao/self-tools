union AddMembershipResult = CollectionMembershipChanged | ValidationFailure | MissingResources | Conflict

union AddReadRecordsResult = ReadRecordsUpdated | ValidationFailure | MissingResources | ChaptersAlreadyRead

type Author {
	id: Int!
	name: String!
	avatar: String!
	site: NovelSite!
	siteId: String!
	description: String!
	createTime: DateTime!
	updateTime: DateTime!
	novels: [Novel!]
	url: String!
}

type AuthorList {
	data: [Author!]!
	total: Int!
}

type AuthorSaved {
	authorId: Int!
}

union AuthorWriteResult = AuthorSaved | ValidationFailure | MissingResources | Conflict

scalar BigDecimal

type Chapter {
	id: Int!
	title: String!
	site: NovelSite!
	siteId: String!
	content: String
	time: DateTime!
	wordCount: Int!
	novelId: Int!
	createTime: DateTime!
	updateTime: DateTime!
	siteNovelId: String!
	isRead: Boolean!
	novel: Novel
	author: Author
	url: String!
}

type ChaptersAlreadyRead {
	chapterIds: [Int!]!
}

type Collection {
	id: Int!
	name: String!
	path: String!
	parentId: Int
	description: String
	createTime: DateTime!
	updateTime: DateTime!
	ancestors: [Collection!]
	children: [Collection!]
}

type CollectionList {
	data: [Collection!]!
	total: Int!
}

type CollectionMembershipChanged {
	collectionId: Int!
	resource: ResourceRef!
	present: Boolean!
}

type CollectionSaved {
	collectionId: Int!
}

union CollectionWriteResult = CollectionSaved | ValidationFailure | MissingResources | Conflict

type CommentSaved {
	novelId: Int!
}

union CommentWriteResult = CommentSaved | ValidationFailure | MissingResources | Conflict

type Conflict {
	reason: ConflictReason!
	resources: [ResourceRef!]!
}

enum ConflictReason {
	COLLECTION_PATH_EXISTS
	SOURCE_ID_EXISTS
	MEMBERSHIP_EXISTS
	COMMENT_EXISTS
}

input CreateNovelInput {
	name: String!
	avatar: String!
	description: String!
	authorId: Int!
	novelStatus: NovelStatus!
	site: NovelSite!
	siteId: String!
	tags: [Int!]!
}

scalar DateTime

union DeleteReadRecordsResult = ReadRecordsUpdated | ValidationFailure

union DeleteResult = ResourceDeleted | ValidationFailure

type DraftAuthorInfo {
	url: String!
	name: String!
	description: String!
	image: String!
	novels: [DraftNovelInfo!]!
	id: String!
	site: NovelSite!
}

type DraftChapterInfo {
	url: String!
	title: String!
	time: DateTime!
	wordCount: Int!
	novelId: String!
	id: String!
	site: NovelSite!
}

type DraftNovelInfo {
	url: String!
	name: String!
	description: String!
	image: String!
	chapters: [DraftChapterInfo!]!
	author: DraftAuthorInfo!
	status: NovelStatus!
	id: String!
	site: NovelSite!
	tags: [DraftTagInfo!]!
}

type DraftTagInfo {
	url: String!
	id: String!
	name: String!
}

type FieldViolation {
	path: [String!]!
	code: ValidationCode!
	min: Int
	max: Int
}

type MissingResources {
	resources: [ResourceRef!]!
}

type MutationRoot {
	createCollection(name: String!, parentId: Int, description: String): CollectionWriteResult!
	updateCollection(id: Int!, name: String!, parentId: Int, description: String): CollectionWriteResult!
	createAuthor(name: String!, avatar: String!, description: String!, site: NovelSite!, siteId: String!): AuthorWriteResult!
	createTag(name: String!, site: NovelSite!, siteId: String!): TagWriteResult!
	createNovel(data: CreateNovelInput!): NovelWriteResult!
	saveDraftAuthor(author: SaveDraftAuthor!): AuthorWriteResult!
	saveDraftNovel(novel: SaveDraftNovel!): NovelWriteResult!
	deleteCollection(id: Int!): DeleteResult!
	deleteAuthor(id: Int!): DeleteResult!
	deleteNovel(id: Int!): DeleteResult!
	deleteTag(id: Int!): DeleteResult!
	deleteCommentForNovel(novelId: Int!): DeleteResult!
	addCommentForNovel(novelId: Int!, content: String!): CommentWriteResult!
	updateCommentForNovel(novelId: Int!, content: String!): CommentWriteResult!
	addCollectionForNovel(collectionId: Int!, novelId: Int!): AddMembershipResult!
	deleteCollectionForNovel(collectionId: Int!, novelId: Int!): RemoveMembershipResult!
	updateNovelByCrawler(novelId: Int!): NovelWriteResult!
	updateAuthorByCrawler(authorId: Int!): AuthorWriteResult!
	addReadRecordsForChapter(novelId: Int!, chapterIds: [Int!]!): AddReadRecordsResult!
	deleteReadRecordsForChapter(chapterIds: [Int!]!): DeleteReadRecordsResult!
}

type Novel {
	id: Int!
	name: String!
	avatar: String!
	description: String!
	novelStatus: NovelStatus!
	site: NovelSite!
	siteId: String!
	createTime: DateTime!
	updateTime: DateTime!
	author: Author
	tags: [Tag!]
	chapters: [Chapter!]
	collections: [Collection!]
	wordCount: BigDecimal
	readPercentage: Float
	lastChapter: Chapter
	firstChapter: Chapter
	comments: NovelComment
	url: String!
}

type NovelComment {
	content: String!
	createTime: DateTime!
	updateTime: DateTime!
}

type NovelList {
	data: [Novel!]!
	total: Int!
}

type NovelSaved {
	novelId: Int!
}

enum NovelSite {
	QIDIAN
	JJWXC
}

enum NovelStatus {
	ONGOING
	COMPLETED
	PAUSED
}

union NovelWriteResult = NovelSaved | ValidationFailure | MissingResources | Conflict

input Pagination {
	page: Int! = 1
	pageSize: Int! = 10
}

type QueryRoot {
	getCollection(id: Int!): Collection
	getAuthor(id: Int!): Author
	getNovel(id: Int!): Novel
	allCollections: [Collection!]!
	allTags: [Tag!]!
	allAuthors(searchName: String): [Author!]!
	getCollections(parentId: Int, pagination: Pagination!): CollectionList!
	queryAuthors(searchName: String, pagination: Pagination!): AuthorList!
	queryTags(pagination: Pagination!): TagList!
	queryNovels(collectionMatch: TagMatch, tagMatch: TagMatch, novelStatus: NovelStatus, pagination: Pagination!): NovelList!
	fetchAuthor(id: String!, novelSite: NovelSite!): DraftAuthorInfo!
	fetchNovel(id: String!, novelSite: NovelSite!): DraftNovelInfo!
}

type ReadRecordsUpdated {
	chapterIds: [Int!]!
	changedCount: Int!
}

union RemoveMembershipResult = CollectionMembershipChanged | ValidationFailure

type ResourceDeleted {
	resource: ResourceRef!
}

enum ResourceKind {
	COLLECTION
	AUTHOR
	TAG
	NOVEL
	CHAPTER
	COMMENT
}

type ResourceRef {
	kind: ResourceKind!
	id: Int!
}

input SaveAuthorInfo {
	id: String!
	site: NovelSite!
	name: String!
	description: String!
	image: String!
}

input SaveChapterInfo {
	id: String!
	name: String!
	time: DateTime!
	wordCount: Int!
}

input SaveDraftAuthor {
	id: String!
	site: NovelSite!
	name: String!
	description: String!
	image: String!
	novels: [SaveNovelInfo!]!
}

input SaveDraftNovel {
	id: String!
	site: NovelSite!
	name: String!
	description: String!
	image: String!
	chapters: [SaveChapterInfo!]!
	tags: [SaveTagInfo!]!
	novelStatus: NovelStatus!
	author: SaveAuthorInfo!
}

input SaveNovelInfo {
	id: String!
	site: NovelSite!
	name: String!
	description: String!
	image: String!
	chapters: [SaveChapterInfo!]!
	tags: [SaveTagInfo!]!
	novelStatus: NovelStatus!
}

input SaveTagInfo {
	id: String!
	name: String!
}

type Tag {
	id: Int!
	name: String!
	site: NovelSite!
	siteId: String!
	createTime: DateTime!
	updateTime: DateTime!
	url: String!
}

type TagList {
	data: [Tag!]!
	total: Int!
}

input TagMatch {
	matchSet: [Int!]!
	fullMatch: Boolean!
}

type TagSaved {
	tagId: Int!
}

union TagWriteResult = TagSaved | ValidationFailure | Conflict

enum ValidationCode {
	REQUIRED
	INVALID_FORMAT
	TOO_LONG
	OUT_OF_RANGE
}

type ValidationFailure {
	issues: [FieldViolation!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
