mutation CreateComment($novelId: Int!, $content: String!) {
  addCommentForNovel(novelId: $novelId, content: $content) {
    __typename
    ... on CommentSaved {
      novelId
    }
    ... on ValidationFailure {
      issues {
        path
        code
        min
        max
      }
    }
    ... on MissingResources {
      resources {
        kind
        id
      }
    }
    ... on Conflict {
      reason
      resources {
        kind
        id
      }
    }
  }
}
