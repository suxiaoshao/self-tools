mutation saveDraftNovel($novel: SaveDraftNovel!) {
  saveDraftNovel(novel: $novel) {
    __typename
    ... on NovelSaved {
      novelId
    }
    ... on ValidationFailure {
      issues {
        path
        code
        min
        max
      }
    }
    ... on MissingResources {
      resources {
        kind
        id
      }
    }
    ... on Conflict {
      reason
      resources {
        kind
        id
      }
    }
  }
}
