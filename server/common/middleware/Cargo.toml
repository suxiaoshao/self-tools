[package]
name = "middleware"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# auth
base64 = { workspace = true, optional = true }

# trace
rand = { workspace = true, optional = true }
tower = { version = "0.5.3", optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http-body = { version = "1.0.1", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
futures-util = { workspace = true, optional = true }

# cors
http = { workspace = true, optional = true }
tower-http = { version = "0.7.0", features = ["cors"], optional = true }
url = { workspace = true, optional = true }

# graphql
async-graphql = { workspace = true, optional = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
axum.workspace = true
anyhow.workspace = true

[features]
auth-http = ["http", "url", "base64"]
trace = ["rand", "tower", "http", "tracing", "futures", "http-body", "pin-project-lite", "futures-util"]
cors = ["http", "tower-http", "url"]
graphql-trace = ["tracing", "async-graphql"]
