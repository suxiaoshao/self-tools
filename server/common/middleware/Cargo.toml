[package]
name = "middleware"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { workspace = true, optional = true, features = ["signal"] }
graphql-common = { workspace = true, optional = true }
service-errors = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# auth
base64 = { workspace = true, optional = true }

# trace
telemetry = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { version = "0.5.3", optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http-body = { version = "1.1.0", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
futures-util = { workspace = true, optional = true }

# cors
http = { workspace = true, optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }
url = { workspace = true, optional = true }

# graphql
async-graphql = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
tower = { version = "0.5.3", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
axum.workspace = true
anyhow.workspace = true

[features]
public-errors = ["axum", "telemetry", "service-errors", "serde_json"]
auth-http = ["http", "url", "base64"]
trace = [
  "tokio",
  "telemetry",
  "axum",
  "tower",
  "http",
  "tracing",
  "futures",
  "http-body",
  "pin-project-lite",
  "futures-util",
]
cors = ["http", "tower-http", "url"]
graphql-trace = ["tracing", "async-graphql", "telemetry", "service-errors", "graphql-common", "serde_json"]
