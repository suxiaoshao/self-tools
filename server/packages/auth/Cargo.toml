[package]
name = "auth"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
service-errors = { workspace = true, features = ["database"] }
telemetry.workspace = true
service-health = { workspace = true, features = ["database", "auth"] }
diesel_migrations.workspace = true

# Thrift
thrift.workspace = true
volo.workspace = true
volo-thrift.workspace = true
tokio = { workspace = true, features = ["full"] }

# authentication
webauthn-rs = "0.5.5"
diesel = { workspace = true, features = ["postgres", "r2d2", "time", "uuid", "serde_json"] }
time = { workspace = true, features = ["serde", "formatting"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
getrandom = "0.4.3"
sha2 = "0.11.0"
hmac = "0.13.0"
base64.workspace = true
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true

# log
tracing.workspace = true
tracing-subscriber.workspace = true

# errors
anyhow.workspace = true

[dev-dependencies]
openssl = "0.10.81"
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry.workspace = true
middleware = { workspace = true, features = ["trace", "graphql-trace", "public-errors"] }
async-graphql.workspace = true
graphql-common.workspace = true
axum.workspace = true
tower = { version = "0.5.3", features = ["util"] }
